[package]
name = "showcase-web"
description = "The Compono showcase in a browser: egui on WebGL, browser history and session storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
compono = { path = "../../crates/compono" }
compono-web = { path = "../../crates/compono-web" }
showcase = { path = "../showcase" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.37"
showcase-egui = { path = "../showcase-egui" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "HtmlCanvasElement", "Window", "console"] }

[lints]
workspace = true
