[package]
name = "uni-bench"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "=0.32.2", features = ["cli"] }
compono-ffi = { path = "../../../crates/compono-ffi" }
ffi-scenario = { path = "../scenario" }
