[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.0-rc.1"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
