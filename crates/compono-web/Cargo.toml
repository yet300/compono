[package]
name = "compono-web"
description = "Browser platform for Compono: history, page lifecycle, session storage and tasks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["compono", "wasm", "browser", "history", "navigation"]
categories = ["gui", "wasm", "web-programming"]

[dependencies]
compono = { version = "1.0.0-rc.1", path = "../compono" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Event",
    "EventTarget",
    "History",
    "Location",
    "MediaQueryList",
    "PopStateEvent",
    "Storage",
    "VisibilityState",
    "Window",
] }

[package.metadata.docs.rs]
default-target = "wasm32-unknown-unknown"
targets = ["wasm32-unknown-unknown"]

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
