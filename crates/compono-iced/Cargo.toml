[package]
name = "compono-iced"
description = "Connects a Compono tree to iced"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["compono", "iced", "ui", "navigation"]
categories = ["gui"]

[dependencies]
compono = { version = "1.0.0-rc", path = "../compono" }
compono-desktop = { version = "1.0.0-rc", path = "../compono-desktop" }
compono-motion = { version = "1.0.0-rc", path = "../compono-motion" }
iced = { version = "0.14", default-features = false, features = ["advanced", "thread-pool"] }

[dev-dependencies]
compono-test = { version = "1.0.0-rc", path = "../compono-test" }

[lints]
workspace = true
